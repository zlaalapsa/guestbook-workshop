[project]
name = "guestbook-workshop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]